[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "win-action-recorder"
version = "0.9.1"
description = "本地 Windows 鼠标键盘动作录制、回放、连点与可视化自定义指令工具"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "WinActionRecorder contributors" }]
dependencies = [
  "PySide6>=6.7,<7",
  "pynput>=1.7.7,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9"]
build = ["PyInstaller>=6.8,<7"]

[project.gui-scripts]
win-action-recorder = "win_action_recorder.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
win_action_recorder = ["assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
